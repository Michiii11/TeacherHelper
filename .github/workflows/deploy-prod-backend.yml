name: Deploy Prod Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-prod-backend.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: coral-chiller-474405-d9
          workload_identity_provider: projects/346197888787/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: github-deployer-prod@coral-chiller-474405-d9.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Deploy backend to Cloud Run
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO_LIVE }}
          STRIPE_PRICE_SCHOOL: ${{ secrets.STRIPE_PRICE_SCHOOL_LIVE }}
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID_LIVE }}
        run: |
          gcloud run deploy teacher-helper-backend-production \
            --source ./backend \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars="STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY},STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET},STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO},STRIPE_PRICE_SCHOOL=${STRIPE_PRICE_SCHOOL},STRIPE_PORTAL_CONFIGURATION_ID=${STRIPE_PORTAL_CONFIGURATION_ID}"
