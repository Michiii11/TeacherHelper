@if (isLoading) {
  <main
    class="create-example-shell loading-dashboard"
    aria-label="Example Loading"
  >
    <section class="school-loading-card">
      <mat-icon>post_add</mat-icon>
      <h2>{{ "common.loading" | translate }}</h2>
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </section>
  </main>
} @else if (example) {
  <div class="preview-dialog">
    @if (showHeader) {
      <div class="preview-header">
        <div class="preview-header-copy">
          <span class="preview-eyebrow">{{ "collection.example" | translate }}</span>
          <h1>{{ "createTest.preview.previewTitle" | translate }}</h1>
        </div>

        <button
          type="button"
          class="preview-close-button"
          (click)="close()"
          [attr.aria-label]="'common.close' | translate"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }

    <div class="preview-content-scroll">
      <div [innerHTML]="previewHtml"></div>
    </div>
  </div>
}
