@if (isLoading) {
  <main
    class="create-example-shell loading-dashboard"
    aria-label="Example Loading"
  >
    <section class="school-loading-card">
      <mat-icon>post_add</mat-icon>
      <h2>{{ "common.loading" | translate }}</h2>
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </section>
  </main>
} @else if (example) {
  <div class="preview-dialog">
    @if (showHeader) {
      <div class="preview-header">
        <h1>{{ "createTest.preview.previewTitle" | translate }}</h1>
      </div>
    }

    <div [innerHTML]="previewHtml"></div>
  </div>
}
