quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,https://teacher-helper-frontend-production-346197888787.europe-west1.run.app,https://teacher-helper-frontend-development-346197888787.europe-west1.run.app
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

quarkus.oidc.auth-server-url=https://teacher-helper.eu.auth0.com
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${AUTH0_CLIENT_ID}
quarkus.oidc.token.audience=https://teacher-helper-api
quarkus.rest-client.auth0-token.url=https://teacher-helper.eu.auth0.com
quarkus.rest-client.auth0-management.url=https://teacher-helper.eu.auth0.com

auth0.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID}
auth0.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET}
auth0.management.audience=https://teacher-helper.eu.auth0.com/api/v2/

frontend.url=${FRONTEND_URL}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

%prod.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false

quarkus.http.root-path=/api

app.jwt.secret=REPLACE_WITH_SECURE_RANDOM_BASE64_OR_32_CHAR_STRING
app.jwt.ttl-ms=3600000

quarkus.package.jar.type=uber-jar

quarkus.mailer.host=${MAIL_HOST}
quarkus.mailer.port=587
quarkus.mailer.username=${MAIL_USER}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.auth-methods=PLAIN

media.bucket=${BUCKET_NAME}

quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.migrate-at-start=true